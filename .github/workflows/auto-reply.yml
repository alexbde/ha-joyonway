name: Auto Reply

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Send acknowledgment reply
        uses: actions/github-script@v9
        with:
          script: |
            const sender = context.payload.sender;
            if (sender.login === context.repo.owner || sender.type === 'Bot' || sender.login.endsWith('[bot]')) {
              console.log(`Skipping auto-reply for ${sender.login}`);
              return;
            }

            const isIssue = Boolean(context.payload.issue);
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            const author = context.payload.issue?.user?.login || context.payload.pull_request?.user?.login;

            let body = isIssue
              ? `Hi @${author}, thank you for reaching out! 👋\n\n`
              : `Hi @${author}, thank you for your contribution! 🎉\n\n`;

            body += `This project is maintained in spare time, so it may take a little while to review and respond, but I will definitely look into this as soon as possible.`;

            if (isIssue) {
              body += `\n\n💡 **In the meantime:**\n` +
                `If you are reporting an issue or unexpected behavior, enabling **debug logging** for the integration in Home Assistant (under Settings -> Devices & Services -> Joyonway -> three dots -> Enable debug logging) and sharing the debug logs (especially raw hex frames or the Diagnostics export via "Download diagnostics") is helpful for troubleshooting.`;
            }

            body += `\n\nThanks for your patience and understanding!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body,
            });
